name: Isolated ViralMint Pexels Evaluation

on:
  push:
    branches:
      - 'codex/viralmint-pexels-eval-*'
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-prototype:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: Install rendering prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Clone ViralMint separately
        run: git clone --depth 1 https://github.com/openclaw-easy/ViralMint.git viralmint-evaluation

      - name: Install only evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts pydantic-settings cryptography python-dotenv pillow httpx

      - name: Render one private prototype
        working-directory: viralmint-evaluation
        run: |
          set -euo pipefail
          test -n "$PEXELS_API_KEY"
          mkdir -p storage/audio storage/generated storage/tmp
          python - <<'PY'
          import asyncio
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root))

          from backend.services.edge_tts_service import generate_voice
          from backend.services.pexels_service import build_stock_video
          from backend.services.caption_service import generate_captions_ass, burn_captions
          from backend.services.video_utils import probe_duration

          script = (
              "That five hundred dollar car payment is not the price. "
              "Start with the vehicle price. Then check dealer fees, optional add-ons, "
              "tax, title, and registration. Also compare the financing terms. "
              "Ask for the out-the-door total in writing and compare that total before you sign. "
              "Check the fees before you sign. DetectHiddenFees.com."
          )

          class ScenePlanner:
              async def chat(self, messages, system=None, max_tokens=None):
                  return json.dumps([
                      {"text": "The advertised monthly payment is not the price.", "query": "car dealership showroom salesperson vehicle", "mood": "confident", "priority": 1},
                      {"text": "Check dealer fees and optional add-ons on the worksheet.", "query": "car purchase contract paperwork signing close up", "mood": "investigative", "priority": 2},
                      {"text": "Compare tax title registration financing and the out-the-door total.", "query": "calculator auto finance documents money close up", "mood": "clear", "priority": 3},
                  ])

          async def main():
              audio = root / "storage/audio/dealer_ood.mp3"
              stock = root / "storage/generated/dealer_ood_stock.mp4"
              captioned = root / "storage/generated/dealer_ood_prototype.mp4"
              ass = root / "storage/tmp/dealer_ood.ass"

              await generate_voice(
                  script,
                  voice_id="en-US-AndrewMultilingualNeural",
                  output_path=audio,
              )
              await build_stock_video(
                  script=script,
                  voice_path=audio,
                  pexels_api_key=os.environ["PEXELS_API_KEY"],
                  aspect_ratio="9:16",
                  ai_client=ScenePlanner(),
                  output_path=stock,
                  visual_style="cinematic",
                  transition_style="dissolve",
              )

              total = probe_duration(audio, 24.0)
              words = script.split()
              per_word = total / len(words)
              segments = []
              for i in range(0, len(words), 6):
                  j = min(i + 6, len(words))
                  segments.append({
                      "start": i * per_word,
                      "end": min(j * per_word, total),
                      "text": " ".join(words[i:j]),
                  })

              await generate_captions_ass(
                  segments=segments,
                  style="glow",
                  aspect_ratio="9:16",
                  output_path=ass,
                  emoji_style="none",
                  hook_text="$499/MO? THAT'S NOT THE PRICE.",
                  hook_duration=2.2,
              )
              await burn_captions(stock, ass, captioned)
              ass.unlink(missing_ok=True)

              # Keep the brand visible without covering the footage or captions.
              branded = root / "storage/generated/dealer_ood_final.mp4"
              font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              duration_text = f"{total:.2f}"
              filter_graph = (
                  f"drawtext=fontfile='{font}':text='DetectHiddenFees.com':fontcolor=white:"
                  "fontsize=42:x=(w-text_w)/2:y=120:box=1:boxcolor=0x091a2b@0.72:boxborderw=14"
              )
              subprocess.run([
                  "ffmpeg", "-y", "-i", str(captioned), "-vf", filter_graph,
                  "-c:v", "libx264", "-preset", "fast", "-crf", "21",
                  "-c:a", "copy", str(branded),
              ], check=True)

              subprocess.run([
                  "ffmpeg", "-y", "-i", str(branded),
                  "-vf", "fps=1/3,scale=360:-1,tile=2x4:padding=8:margin=8",
                  "-frames:v", "1", str(root / "storage/generated/contact-sheet.png"),
              ], check=True)
              print(f"duration={duration_text}")
              print("scenes=3")
              print("youtube_published=no")

          asyncio.run(main())
          PY

      - name: Upload private evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: viralmint-dealer-ood-prototype
          path: viralmint-evaluation/storage/generated/
          if-no-files-found: error
          retention-days: 7
