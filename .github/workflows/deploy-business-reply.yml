name: Deploy DetectHiddenFees business reply Worker

on:
  push:
    branches: [main]
    paths:
      - 'business-reply-worker/**'
      - 'scripts/deploy-business-reply-infrastructure.js'
      - 'scripts/process-business-reply-events.js'
      - 'seo/outreach-automation.json'
      - '.github/workflows/deploy-business-reply.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detecthiddenfees-business-reply-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependency
        working-directory: business-reply-worker
        run: npm install --no-package-lock --ignore-scripts

      - name: Verify business-only reply safety gates
        run: node scripts/test-business-reply-system.js

      - name: Create or reuse the isolated KV namespace
        id: prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/deploy-business-reply-infrastructure.js prepare

      - name: Generate deployment-only Wrangler configuration
        env:
          NAMESPACE_ID: ${{ steps.prepare.outputs.namespace_id }}
        run: node scripts/write-business-reply-wrangler-config.js

      - name: Deploy the email Worker
        working-directory: business-reply-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          output="$(npx --yes wrangler@latest deploy --config wrangler.ci.toml 2>&1)"
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            safe_output="${output//$CLOUDFLARE_API_TOKEN/[REDACTED]}"
            safe_output="$(printf '%s' "$safe_output" | tr '\n' ' ' | cut -c1-1600)"
            echo "::error title=Cloudflare Worker deployment::${safe_output}"
            exit "$exit_code"
          fi
          printf '%s\n' "$output"

      - name: Create or verify only the research@ Worker route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: node scripts/deploy-business-reply-infrastructure.js activate

      - name: Send one internal research@ inbound-path test
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OUTREACH_SEND_ENABLED: '1'
          OUTREACH_TEST_ENABLED: '1'
          OUTREACH_TEST_RECIPIENT: research@detecthiddenfees.com
          OUTREACH_FROM_EMAIL: support@detecthiddenfees.com
          OUTREACH_REPLY_TO: research@detecthiddenfees.com
        run: node scripts/outreach-automation.js test

      - name: Poll and process the internal inbound event
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPLY_EVENT_NAMESPACE_TITLE: detecthiddenfees-business-reply
        run: |
          for attempt in 1 2 3 4 5 6; do
            result="$(node scripts/process-business-reply-events.js)"
            echo "$result"
            if node -e "const result = JSON.parse(process.argv[1]); process.exit(result.processed > 0 ? 0 : 1);" "$result"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Business reply inbound test::No KV event was observed during the bounded retry window"
          exit 1

      - name: Confirm external outreach remains disabled
        run: node scripts/test-business-reply-system.js
