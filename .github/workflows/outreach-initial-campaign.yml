name: DetectHiddenFees controlled initial outreach

on:
  schedule:
    - cron: '41 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detecthiddenfees-controlled-outreach
  cancel-in-progress: false

jobs:
  send-initial-campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check outreach activation gate
        id: gate
        shell: bash
        run: |
          if grep -q '"enabled": true' seo/outreach-automation.json; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send no more than four verified initial messages
        if: steps.gate.outputs.enabled == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OUTREACH_SEND_ENABLED: '1'
          OUTREACH_FROM_EMAIL: support@detecthiddenfees.com
          OUTREACH_REPLY_TO: research@detecthiddenfees.com
        run: node scripts/outreach-automation.js send

      - name: Commit status-only send changes
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          if git diff --quiet -- seo/outreach-status.json; then
            echo "No initial outreach status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/outreach-status.json
          git commit -m "Record controlled outreach sends"
          git push origin HEAD:main
