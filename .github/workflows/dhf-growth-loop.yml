name: DHF Growth Loop

on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dhf-growth-loop
  cancel-in-progress: false

jobs:
  growth-cycle:
    # GitHub-hosted fallback remains active until the one-time desktop
    # registration is complete and the repository variable is enabled.
    runs-on: ${{ vars.DHF_SELF_HOSTED_READY == 'true' && 'dhf-growth' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore private growth state
        uses: actions/cache@v4
        with:
          path: private/growth-engine
          key: dhf-growth-state-${{ github.run_id }}
          restore-keys: |
            dhf-growth-state-

      - name: Run one guarded growth cycle
        env:
          GROWTH_LOOP_RUN_ID: ${{ github.run_id }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          OUTREACH_SEND_ENABLED: '1'
          GROWTH_LOOP_EXTERNAL_SEND: '1'
          OUTREACH_FROM_EMAIL: support@detecthiddenfees.com
          OUTREACH_REPLY_TO: research@detecthiddenfees.com
        run: node scripts/run-growth-loop.js --once

      - name: Record local heartbeat
        if: always()
        run: node scripts/write-growth-heartbeat.js workflow ${{ job.status }}

      - name: Validate loop, safeguards, and private state
        run: node scripts/validate-growth-loop.js

      - name: Add daily digest to the run summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path private/growth-engine/daily-digest.md) {
            Get-Content private/growth-engine/daily-digest.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } else {
            "Growth digest was not produced." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Store daily digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhf-growth-digest-${{ github.run_id }}
          path: private/growth-engine/daily-digest.md
          if-no-files-found: warn
          retention-days: 30
